# Install as a file included from the nginx `http` block (for example,
# /etc/nginx/conf.d/negotiation-arena.conf). The map and zone directives must
# remain outside the server blocks.

# Empty map keys are ignored by limit_req_zone. Static files therefore use
# only the general per-IP limit, while API and API writes have tighter limits.
map $uri $arena_api_client {
    default "";
    ~^/api/ $binary_remote_addr;
}

map $uri $arena_api_total {
    default "";
    ~^/api/ all;
}

map "$request_method:$uri" $arena_write_client {
    default "";
    ~^(POST|PATCH):/api/ $binary_remote_addr;
}

map "$request_method:$uri" $arena_write_total {
    default "";
    ~^(POST|PATCH):/api/ all;
}

# Only these synchronous endpoints keep a database session open while Ollama
# generates a response. Keep their in-flight count below the DB pool limit.
map "$request_method:$uri" $arena_llm_active {
    default "";
    ~^POST:(/api/chat|/api/sessions/[^/]+/suggest)$ all;
}

limit_req_zone $binary_remote_addr zone=arena_all:10m rate=20r/s;
limit_req_zone $arena_api_client zone=arena_api:10m rate=10r/s;
limit_req_zone $arena_api_total zone=arena_api_total:1m rate=50r/s;
limit_req_zone $arena_write_client zone=arena_write:10m rate=1r/s;
limit_req_zone $arena_write_total zone=arena_write_total:1m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=arena_connections:10m;
limit_conn_zone $arena_api_total zone=arena_api_active:1m;
limit_conn_zone $arena_write_total zone=arena_write_active:1m;
limit_conn_zone $arena_llm_active zone=arena_llm_active:1m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/negotiation-arena;
    server_tokens off;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req zone=arena_all burst=100 nodelay;
    limit_conn arena_connections 64;

    # Keep HTTP-01 validation reachable for automatic certificate renewal.
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://c2-217-73-57-48.elastic.k2.cloud$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name c2-217-73-57-48.elastic.k2.cloud;

    ssl_certificate /etc/letsencrypt/live/c2-217-73-57-48.elastic.k2.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c2-217-73-57-48.elastic.k2.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/negotiation-arena;
    index index.html;
    server_tokens off;

    client_max_body_size 32k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 30s;

    limit_req_status 429;
    limit_conn_status 429;
    limit_req zone=arena_all burst=100 nodelay;
    limit_req zone=arena_api burst=100 nodelay;
    limit_req zone=arena_api_total burst=100 nodelay;
    limit_req zone=arena_write burst=60 nodelay;
    limit_req zone=arena_write_total burst=100 nodelay;
    limit_conn arena_connections 64;
    limit_conn arena_api_active 128;
    limit_conn arena_write_active 64;
    limit_conn arena_llm_active 10;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # proxy_pass has no URI suffix: /api/... reaches FastAPI unchanged.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace client-supplied X-Forwarded-For rather than extending it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 180s;
    }

    location = /api {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
