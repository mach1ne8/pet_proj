services:
  postgres:
    image: postgres:17-alpine
    container_name: negotiation-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: negotiation_arena
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U arena -d negotiation_arena"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
